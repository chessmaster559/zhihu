name: Build Kanshan C5

on:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Validate the C5 fork
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: |
          python -m pip install Pillow
          python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select the C5 fork variant
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          variants = json.loads(subprocess.check_output(
              [sys.executable, "scripts/build.py", "--list-boards", "--json"], text=True))
          selected = [item for item in variants
                      if item["board"] == "espressif/esp-sensairshuttle"
                      and item["name"] == "esp-sensairshuttle"]
          if len(selected) != 1:
              raise SystemExit("Expected exactly one SensairShuttle C5 variant")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("variants=" + json.dumps(selected, separators=(",", ":")) + "\n")
          PY

  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare C5 Kanshan assets
        if: ${{ matrix.board == 'espressif/esp-sensairshuttle' }}
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python -m pip install Pillow
          python custom_assets/build_eaf_assets.py --pack-only

      - name: Build current variant
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/build.py ${{ matrix.board }} --name ${{ matrix.name }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error
